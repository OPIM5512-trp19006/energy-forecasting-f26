<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44506a"/>
    </marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9c0cc"/>
    </marker>
    <style>
      .src { fill:#f1f3f8; stroke:#b9c0cc; }
      .fn { fill:#0A1F44; stroke:#0A1F44; }
      .model { fill:#0A1F44; stroke:#F2A900; stroke-width:4; }
      .opt { fill:#ffffff; stroke:#9aa3b5; stroke-dasharray:6 4; }
      .file { fill:#fff6dc; stroke:#F2A900; }
      .optfile { fill:#f7f8fb; stroke:#c9ced8; stroke-dasharray:6 4; }
      .dave { fill:#e8f5ee; stroke:#10AC84; }
      .once { fill:#ffffff; stroke:#8E44AD; stroke-dasharray:5 4; }
      .t { fill:#1c1c1e; }
      .g { fill:#7b8496; }
      .w { fill:#ffffff; }
      .m { fill:#6b7280; font-size:12px; }
      .h { font-size:14px; font-weight:700; fill:#0A1F44; }
      .b { font-weight:700; }
      .pill { font-size:11px; font-weight:700; letter-spacing:.04em; }
      .line { stroke:#44506a; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .faint { stroke:#b9c0cc; stroke-width:1.6; fill:none; marker-end:url(#arrowgray); }
      .read { stroke:#1f6feb; stroke-width:2; fill:none; stroke-dasharray:6 4; marker-end:url(#arrowblue); }
    </style>
  </defs>
  <rect width="1200" height="740" fill="#ffffff"/>
  <text x="20" y="32" font-size="22" font-weight="700" fill="#0A1F44">What runs in your energy project</text>
  <text x="20" y="54" class="m">Train once in Colab (bottom row). Then Cloud Functions run every hour on their own, and Dr. Dave's collector scores everyone.</text>
  <!-- badge legend -->
  <rect x="742" y="20" width="84" height="20" rx="10" fill="#d62828"/><text x="784" y="34" class="pill w" text-anchor="middle">ESSENTIAL</text>
  <text x="832" y="34" class="m">your forecast can't run without it</text>
  <rect x="742" y="44" width="84" height="20" rx="10" fill="#e4e7ee"/><text x="784" y="58" class="pill g" text-anchor="middle">OPTIONAL</text>
  <text x="832" y="58" class="m">a cool scraper, nothing reads it yet</text>

  <text x="20" y="92" class="h">Where the data comes from</text>
  <text x="320" y="92" class="h">Your Cloud Functions (every hour)</text>
  <text x="640" y="92" class="h">Your bucket</text>
  <text x="950" y="92" class="h">Dr. Dave's side</text>

  <!-- Row 1: weather that happened (OPTIONAL) -->
  <rect x="20" y="104" width="250" height="66" rx="10" class="src" opacity="0.6"/>
  <text x="32" y="128" class="g b">Iowa State Mesonet</text>
  <text x="32" y="146" class="g">official airport weather reports</text>
  <text x="32" y="162" class="m">Bradley Airport (BDL), every hour</text>
  <rect x="320" y="104" width="260" height="66" rx="10" class="opt"/>
  <text x="332" y="128" class="g b">:05  scraper-weather-obs</text>
  <rect x="496" y="113" width="76" height="18" rx="9" fill="#e4e7ee"/><text x="534" y="126" class="pill g" text-anchor="middle">OPTIONAL</text>
  <text x="332" y="146" class="g">the weather that actually happened.</text>
  <text x="332" y="162" class="g">Production never reads it.</text>
  <rect x="640" y="104" width="260" height="66" rx="10" class="optfile"/>
  <text x="652" y="128" class="g b">bdl_weather_obs_master.csv</text>
  <text x="652" y="146" class="g">real weather, hour by hour</text>
  <text x="652" y="162" class="m">only if you retrain on new weeks later</text>
  <path d="M270,137 L316,137" class="faint"/>
  <path d="M580,137 L636,137" class="faint"/>

  <!-- Row 2: weather forecast (ESSENTIAL) -->
  <rect x="20" y="190" width="250" height="66" rx="10" class="src"/>
  <text x="32" y="214" class="t b">National Weather Service</text>
  <text x="32" y="232" class="t">hourly forecast, next 24 hours</text>
  <text x="32" y="248" class="m">forecast.weather.gov, Bradley</text>
  <rect x="320" y="190" width="260" height="66" rx="10" class="fn"/>
  <text x="332" y="214" class="w b">:05  scraper-weather-</text>
  <text x="332" y="230" class="w b">forecast</text>
  <rect x="490" y="199" width="82" height="18" rx="9" fill="#d62828"/><text x="531" y="212" class="pill w" text-anchor="middle">ESSENTIAL</text>
  <text x="332" y="248" class="w">tomorrow's weather = the model's input</text>
  <rect x="640" y="190" width="260" height="66" rx="10" class="file"/>
  <text x="652" y="214" class="t b">bdl_weather_forecast_master.csv</text>
  <text x="652" y="232" class="t">expected weather, every hour</text>
  <text x="652" y="248" class="m">temp, dew point, humidity, wind, clouds</text>
  <path d="M270,223 L316,223" class="line"/>
  <path d="M580,223 L636,223" class="line"/>

  <!-- Row 3: ISO New England (ESSENTIAL) -->
  <rect x="20" y="276" width="250" height="96" rx="10" class="src"/>
  <text x="32" y="300" class="t b">ISO New England</text>
  <text x="32" y="318" class="t">Connecticut load right now</text>
  <text x="32" y="334" class="t">+ ISO's own load forecast</text>
  <text x="32" y="352" class="m">needs your free ISO Express login</text>
  <text x="32" y="366" class="m">(the two GitHub secrets)</text>
  <rect x="320" y="276" width="260" height="96" rx="10" class="fn"/>
  <text x="332" y="300" class="w b">:15  scraper-isone</text>
  <rect x="490" y="285" width="82" height="18" rx="9" fill="#d62828"/><text x="531" y="298" class="pill w" text-anchor="middle">ESSENTIAL</text>
  <text x="332" y="318" class="w">yesterday's load is always known,</text>
  <text x="332" y="334" class="w">so load_yesterday_mw is one of</text>
  <text x="332" y="350" class="w">your 11 features. No load data,</text>
  <text x="332" y="366" class="w">no forecast.</text>
  <rect x="640" y="276" width="260" height="44" rx="10" class="file"/>
  <text x="652" y="295" class="t b">ct_load_5min_hourly_master.csv</text>
  <text x="652" y="312" class="m">real load: feeds load_yesterday_mw</text>
  <rect x="640" y="328" width="260" height="44" rx="10" class="file"/>
  <text x="652" y="347" class="t b">isone_ct_forecast_master.csv</text>
  <text x="652" y="364" class="m">the professionals' forecast, to compare</text>
  <path d="M270,324 L316,324" class="line"/>
  <path d="M580,304 L636,298" class="line"/>
  <path d="M580,344 L636,350" class="line"/>

  <!-- Row 4: forecast-24h (THE MODEL) -->
  <rect x="320" y="424" width="260" height="84" rx="10" class="model"/>
  <text x="332" y="448" class="w b">:20  forecast-24h</text>
  <rect x="458" y="433" width="114" height="18" rx="9" fill="#F2A900"/><text x="515" y="446" class="pill" fill="#0A1F44" text-anchor="middle">THE MODEL</text>
  <text x="332" y="468" class="w">YOUR model forecasts the next</text>
  <text x="332" y="484" class="w">24 hours of Connecticut load</text>
  <text x="332" y="500" class="w">Lab 5 tonight: ship it (Part 7)</text>
  <rect x="640" y="424" width="260" height="84" rx="10" class="file"/>
  <text x="652" y="448" class="t b">forecasts/latest.csv</text>
  <text x="652" y="466" class="t">+ forecasts_master.csv</text>
  <text x="652" y="484" class="m">your newest 24 hours, and every</text>
  <text x="652" y="498" class="m">forecast you ever made</text>
  <path d="M580,466 L636,466" class="line"/>
  <!-- reads (blue dashed): weather forecast, yesterday's load, the model -->
  <path d="M640,244 L612,244 L612,440 L584,440" class="read"/>
  <path d="M640,304 L612,304" stroke="#1f6feb" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <path d="M700,564 L700,532 L450,532 L450,512" class="read"/>
  <text x="20" y="420" class="m" fill="#1f6feb">blue dashed = the three things</text>
  <text x="20" y="436" class="m" fill="#1f6feb">forecast-24h reads every hour:</text>
  <text x="20" y="452" class="m" fill="#1f6feb">the weather forecast, yesterday's</text>
  <text x="20" y="468" class="m" fill="#1f6feb">load, and your model</text>

  <!-- Row 5: once, by hand -->
  <text x="20" y="548" class="h">Once, by hand (Lab 5 tonight)</text>
  <rect x="20" y="560" width="250" height="96" rx="10" class="once"/>
  <text x="32" y="584" class="t b">Dr. Dave's history file</text>
  <text x="32" y="602" class="t">33,215 hours, Jan 2023 to Oct 2026</text>
  <text x="32" y="618" class="t">Bradley Airport ONLY + CT load</text>
  <text x="32" y="636" class="m">bdl_ct_load_hourly_2023_2026.csv</text>
  <text x="32" y="650" class="m">(OPIM5512-notebooks, Module4/data)</text>
  <rect x="320" y="560" width="260" height="96" rx="10" class="once"/>
  <text x="332" y="584" class="t b">Lab 5 notebook in Colab</text>
  <text x="332" y="602" class="t">build the 11 features (incl. load</text>
  <text x="332" y="618" class="t">yesterday), beat the baselines, tune</text>
  <text x="332" y="636" class="m">Part 7 uploads the champion</text>
  <rect x="640" y="568" width="260" height="80" rx="10" class="file"/>
  <text x="652" y="592" class="t b">models/model.joblib</text>
  <text x="652" y="610" class="t">+ model_card.json</text>
  <text x="652" y="628" class="m">your live model (Lab 6 adds</text>
  <text x="652" y="642" class="m">its low/high range to the card)</text>
  <path d="M270,608 L316,608" class="line"/>
  <path d="M580,608 L636,608" class="line"/>

  <!-- Dr. Dave's side -->
  <rect x="950" y="276" width="230" height="96" rx="10" class="dave"/>
  <text x="962" y="300" class="t b">:35  Dr. Dave's collector</text>
  <text x="962" y="318" class="t">copies every shared bucket's</text>
  <text x="962" y="334" class="t">forecasts (Lab 5 Part 7e)</text>
  <text x="962" y="352" class="m">frozen once collected: no edits</text>
  <rect x="950" y="424" width="230" height="84" rx="10" class="dave"/>
  <text x="962" y="448" class="t b">Class leaderboard</text>
  <text x="962" y="466" class="t">scores every forecast hour</text>
  <text x="962" y="482" class="t">against the real load</text>
  <text x="962" y="498" class="m">nicknames only, every hour</text>
  <path d="M900,466 C930,446 925,374 950,349" class="line"/>
  <path d="M1065,372 L1065,420" class="line"/>

  <!-- why -->
  <text x="950" y="560" class="h">Why each piece?</text>
  <text x="950" y="582" class="t"><tspan class="b">Weather forecast</tspan>: tomorrow's</text>
  <text x="950" y="598" class="t">weather can only be a forecast.</text>
  <text x="950" y="620" class="t"><tspan class="b">Live load</tspan>: yesterday's load is</text>
  <text x="950" y="636" class="t">always known, so it's a feature.</text>
  <text x="950" y="658" class="t"><tspan class="b">Real weather</tspan>: optional, for</text>
  <text x="950" y="674" class="t">retraining on new weeks later.</text>
  <text x="20" y="712" class="m">All times are minutes past each hour. Everything lives in your own Google Cloud project; Dr. Dave can only read your bucket after you share it.</text>
  <text x="20" y="728" class="m">The model trains on weather that happened, but in production it only has the forecast: forecast error is part of the job (Lab 6 measures it).</text>
</svg>
