name: Deploy forecast-24h-dl (CF Gen2 + Cloud Scheduler) - OPIM 5509
# YOUR deep learning model (OPIM 5509 final project) forecasts Connecticut load for the next 24 hours.
# It replaces forecast-24h: this workflow pauses forecast-24h's hourly job if it finds one, since both write the same files.
# Run it by hand only: Actions -> "Deploy forecast-24h-dl" -> Run workflow (it never runs on a push).
# Needs the repository variable COURSE = 5509, so an OPIM 5512 fork can't deploy it by mistake.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  REGION: ${{ vars.REGION }}
  FUNCTION_NAME: forecast-24h-dl
  FUNCTION_DIR: cloud_function/forecast-24h-dl
  ENTRY_POINT: forecast_24h_dl_http
  RUNTIME: python312
  BUCKET_NAME: ${{ vars.BUCKET_NAME }}
  TIMEOUT_SECONDS: "300"
  MEMORY: "2Gi"                                       # TensorFlow + a small LSTM fit easily
  # Align with your other workflows
  RUNTIME_SA: ${{ vars.RUNTIME_SA }}                 # function runtime SA (email)
  DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}               # GitHub deploy SA (email)
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  SCHEDULE_BODY: '{"dry_run":false}'
  CRON_EXPR: "20 * * * *"                              # :20 each hour (ET)

jobs:
  # OPIM 5512 forks see this workflow too: it only deploys when the repository variable COURSE is 5509
  not-5509:
    if: vars.COURSE != '5509'
    runs-on: ubuntu-latest
    steps:
      - name: Stop - this workflow is for OPIM 5509 only
        run: |
          echo "::error::forecast-24h-dl is the OPIM 5509 deep learning function. OPIM 5512 students: use 'Deploy forecast-24h' instead (nothing was changed). OPIM 5509 students: add the repository variable COURSE = 5509 (Settings > Secrets and variables > Actions > Variables), then run this again."
          exit 1

  deploy:
    # Deploys only from YOUR fork (the course repo has no Google Cloud project behind it), and only for OPIM 5509
    if: github.repository_owner != 'drdave-teaching' && vars.COURSE == '5509'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          ls -la "${FUNCTION_DIR}"
          test -f "${FUNCTION_DIR}/main.py"
          test -f "${FUNCTION_DIR}/requirements.txt"

      - name: Deploy Cloud Function (Gen2)
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          python3 - <<'PY'
          import json, os
          env = {'PROJECT_ID': os.environ['PROJECT_ID'], 'GCS_BUCKET': os.environ['BUCKET_NAME']}
          env['ENERGY_PREFIX'] = 'energy'
          json.dump(env, open('/tmp/fn_env.json', 'w'))
          PY
          SA_ARGS=()
          if [[ -n "${RUNTIME_SA:-}" ]]; then
            gcloud iam service-accounts describe "${RUNTIME_SA}" >/dev/null 2>&1
            SA_ARGS=(--service-account="${RUNTIME_SA}")
          fi

          retry gcloud functions deploy "${FUNCTION_NAME}" \
            --gen2 \
            --region="${REGION}" \
            --runtime="${RUNTIME}" \
            --source="${FUNCTION_DIR}" \
            --entry-point="${ENTRY_POINT}" \
            --trigger-http \
            --no-allow-unauthenticated \
            --timeout="${TIMEOUT_SECONDS}" \
            --memory="${MEMORY}" \
            "${SA_ARGS[@]}" \
            --env-vars-file=/tmp/fn_env.json

      - name: Grant invoker to deployer & runtime SAs
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          retry gcloud functions add-invoker-policy-binding "${FUNCTION_NAME}" \
            --gen2 --region "${REGION}" \
            --member="serviceAccount:${DEPLOYER_SA}"
          if [[ -n "${RUNTIME_SA:-}" ]]; then
            retry gcloud functions add-invoker-policy-binding "${FUNCTION_NAME}" \
              --gen2 --region "${REGION}" \
              --member="serviceAccount:${RUNTIME_SA}"
          fi

      - name: Get Function URL
        id: cfurl
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          URL=$(gcloud functions describe "${FUNCTION_NAME}" --gen2 --region "${REGION}" --format='value(serviceConfig.uri)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Function URL: ${URL}"

      - name: Ensure Scheduler API enabled
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          gcloud services list --enabled --filter="cloudscheduler.googleapis.com" --format="value(config.name)" | grep -q cloudscheduler.googleapis.com \
            || gcloud services enable cloudscheduler.googleapis.com

      - name: Bootstrap IAM for Scheduler OIDC (runtime SA)
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          if [[ -z "${RUNTIME_SA:-}" ]]; then
            echo "::error::RUNTIME_SA is not set. Add repo variable RUNTIME_SA."
            exit 1
          fi

          PROJECT_NUMBER="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          SCHED_AGENT="service-${PROJECT_NUMBER}@gcp-sa-cloudscheduler.iam.gserviceaccount.com"
          echo "Scheduler agent: ${SCHED_AGENT}"

          # 1) Scheduler may mint OIDC tokens as the runtime SA
          if ! retry gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${SCHED_AGENT}" \
            --role="roles/iam.serviceAccountTokenCreator"; then
            echo "::error::Permission denied adding tokenCreator to ${RUNTIME_SA}. Run (once as project owner):"
            echo "gcloud iam service-accounts add-iam-policy-binding \"${RUNTIME_SA}\" --member=\"serviceAccount:${SCHED_AGENT}\" --role=\"roles/iam.serviceAccountTokenCreator\""
            exit 1
          fi

          # 2) Deployer may 'actAs' the runtime SA to create/update the job
          if ! retry gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/iam.serviceAccountUser"; then
            echo "::error::Permission denied adding ServiceAccountUser for ${DEPLOYER_SA} on ${RUNTIME_SA}. Run:"
            echo "gcloud iam service-accounts add-iam-policy-binding \"${RUNTIME_SA}\" --member=\"serviceAccount:${DEPLOYER_SA}\" --role=\"roles/iam.serviceAccountUser\""
            exit 1
          fi

      - name: Pause forecast-24h if it is also scheduled (both write energy/forecasts/latest.csv)
        shell: bash
        run: |
          set -euo pipefail
          if gcloud scheduler jobs describe forecast-24h-hourly --location="${REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs pause forecast-24h-hourly --location="${REGION}" || true
            echo "::notice::Paused forecast-24h-hourly: forecast-24h-dl now writes your forecasts."
          fi

      - name: Create/Update Cloud Scheduler job (:20 ET, OIDC)
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          JOB_NAME="${FUNCTION_NAME}-hourly"
          URL="${{ steps.cfurl.outputs.url }}"
          [[ -z "${URL}" ]] && { echo "Function URL empty"; exit 1; }

          if gcloud scheduler jobs describe "$JOB_NAME" --location="${REGION}" >/dev/null 2>&1; then
            retry gcloud scheduler jobs update http "$JOB_NAME" \
              --location="${REGION}" \
              --schedule="${CRON_EXPR}" \
              --time-zone="America/New_York" \
              --uri="${URL}" \
              --http-method=POST \
              --message-body='${{ env.SCHEDULE_BODY }}' \
              --attempt-deadline="${TIMEOUT_SECONDS}s" \
              --oidc-service-account-email="${RUNTIME_SA}" \
              --oidc-token-audience="${URL}"
          else
            retry gcloud scheduler jobs create http "$JOB_NAME" \
              --location="${REGION}" \
              --schedule="${CRON_EXPR}" \
              --time-zone="America/New_York" \
              --uri="${URL}" \
              --http-method=POST \
              --message-body='${{ env.SCHEDULE_BODY }}' \
              --attempt-deadline="${TIMEOUT_SECONDS}s" \
              --oidc-service-account-email="${RUNTIME_SA}" \
              --oidc-token-audience="${URL}"
          fi

      # Mint an ID token via the Auth action (no TokenCreator needed)
      - name: Mint ID token for smoke
        id: auth-smoke
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: "id_token"
          id_token_audience: ${{ steps.cfurl.outputs.url }}
          id_token_include_email: true

      - name: Smoke invoke (authenticated)
        shell: bash
        run: |
          set -euo pipefail
          # Retry helper: a brand-new project often rejects simultaneous deploys/permission edits (409, 'concurrent policy changes')
          retry() { local n=1; until "$@"; do if [ "$n" -ge 5 ]; then return 1; fi; echo "::warning::Attempt $n failed (often another deploy running at the same moment). Retrying in $((n*20))s..."; sleep $((n*20)); n=$((n+1)); done; }
          URL="${{ steps.cfurl.outputs.url }}"
          TOKEN="${{ steps.auth-smoke.outputs.id_token }}"
          echo "POST $URL"
          curl -i -sS -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '${{ env.SCHEDULE_BODY }}' || true
